steps:
  # 0. Automated test verification gate before build & deploy (install dependencies in clean workspace)
  - name: 'node:22-slim'
    entrypoint: 'npm'
    args: ['ci']
  - name: 'node:22-slim'
    entrypoint: 'npm'
    args: ['test']

  # 1. Build the Docker image with a clean tag (without trailing dashes)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ebookoseraserver:$COMMIT_SHA'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ebookoseraserver:latest'
      - '.'

  # 2. Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ebookoseraserver:$COMMIT_SHA'

  # 3. Deploy to Cloud Run automatically with production resilience
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ebookoseraserver'
      - '--image'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ebookoseraserver:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--no-cpu-throttling'
      - '--timeout'
      - '900'
      - '--port'
      - '8080'
      - '--allow-unauthenticated'

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ebookoseraserver:$COMMIT_SHA'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ebookoseraserver:latest'

options:
  logging: CLOUD_LOGGING_ONLY
